<head>

    <!-- Google Fonts: Orbitron for HUD headers, Rajdhani for data readouts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --hud-primary: #00f3ff;
            --hud-secondary: #0066ff;
            --hud-rgb: 0, 243, 255;
            --bg-deep: #030914;
        }
        body.theme-friday {
            --hud-primary: #ff3355;
            --hud-secondary: #ffaa00;
            --hud-rgb: 255, 51, 85;
            --bg-deep: #140307;
        }
        body.theme-stealth {
            --hud-primary: #00ff88;
            --hud-secondary: #00994d;
            --hud-rgb: 0, 255, 136;
            --bg-deep: #021008;
        }
        body.theme-hulkbuster {
            --hud-primary: #ffcc00;
            --hud-secondary: #ff3300;
            --hud-rgb: 255, 204, 0;
            --bg-deep: #140b02;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-deep);
            color: #e0faff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 42%, rgba(var(--hud-rgb), 0.16) 0%, transparent 60%),
                linear-gradient(rgba(var(--hud-rgb), 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--hud-rgb), 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px, 28px 28px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .font-hud {
            font-family: 'Orbitron', sans-serif;
        }
        
        /* Holographic Cards & Borders */
        .hud-panel {
            background: rgba(5, 19, 36, 0.72);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(var(--hud-rgb), 0.38);
            box-shadow: 0 0 18px rgba(var(--hud-rgb), 0.12), inset 0 0 15px rgba(var(--hud-rgb), 0.07);
            position: relative;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hud-panel:active, .hud-panel.active-module {
            border-color: var(--hud-primary);
            box-shadow: 0 0 25px rgba(var(--hud-rgb), 0.45), inset 0 0 20px rgba(var(--hud-rgb), 0.2);
            transform: scale(0.98);
        }
        /* Corner Brackets */
        .hud-corner::before, .hud-corner::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: var(--hud-primary);
            pointer-events: none;
        }
        .hud-corner::before {
            top: -1px; left: -1px;
            border-top: 2px solid var(--hud-primary);
            border-left: 2px solid var(--hud-primary);
        }
        .hud-corner::after {
            bottom: -1px; right: -1px;
            border-bottom: 2px solid var(--hud-primary);
            border-right: 2px solid var(--hud-primary);
        }

        /* Animations for the Arc Reactor Core */
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.75; }
            50% { transform: scale(1.06); opacity: 1; }
        }
        .ring-spin-1 { animation: spin-slow 24s linear infinite; }
        .ring-spin-2 { animation: spin-reverse 16s linear infinite; }
        .ring-spin-3 { animation: spin-slow 9s linear infinite; }
        .core-pulse { animation: pulse-ring 3s ease-in-out infinite; }

        /* State-based Core Glows */
        .state-listening .core-glow {
            filter: drop-shadow(0 0 24px #ff3366);
        }
        .state-thinking .core-glow {
            filter: drop-shadow(0 0 26px #ffaa00);
        }
        .state-speaking .core-glow {
            filter: drop-shadow(0 0 28px #00ffaa);
        }
        .state-online .core-glow {
            filter: drop-shadow(0 0 20px var(--hud-primary));
        }

        /* Equalizer Bars */
        .eq-bar {
            transition: height 0.08s ease;
            background-color: var(--hud-primary);
        }

        /* AR Camera Background Layer */
        #ar-camera-feed {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            opacity: 0.55;
            filter: contrast(1.15) saturate(1.2);
        }
        #ar-reticle {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            border: 1px solid rgba(var(--hud-rgb), 0.25);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(3, 9, 20, 0.6); }
        ::-webkit-scrollbar-thumb { background: var(--hud-primary); border-radius: 9999px; }
    </style>
</head>
