<head>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron for HUD headers, Rajdhani for data readouts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --cyan-glow: #00f3ff;
            --cyan-dim: rgba(0, 243, 255, 0.18);
            --bg-deep: #030914;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-deep);
            color: #e0faff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 42%, rgba(0, 243, 255, 0.14) 0%, transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px, 28px 28px;
        }
        .font-hud {
            font-family: 'Orbitron', sans-serif;
        }
        
        /* Holographic Cards & Borders */
        .hud-panel {
            background: rgba(5, 19, 36, 0.72);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.35);
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.12), inset 0 0 15px rgba(0, 243, 255, 0.07);
            position: relative;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hud-panel:active, .hud-panel.active-module {
            border-color: #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.18);
            transform: scale(0.98);
        }
        /* Corner Brackets */
        .hud-corner::before, .hud-corner::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: #00f3ff;
            pointer-events: none;
        }
        .hud-corner::before {
            top: -1px; left: -1px;
            border-top: 2px solid #00f3ff;
            border-left: 2px solid #00f3ff;
        }
        .hud-corner::after {
            bottom: -1px; right: -1px;
            border-bottom: 2px solid #00f3ff;
            border-right: 2px solid #00f3ff;
        }

        /* Animations for the Arc Reactor Core */
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.75; }
            50% { transform: scale(1.06); opacity: 1; }
        }
        .ring-spin-1 { animation: spin-slow 24s linear infinite; }
        .ring-spin-2 { animation: spin-reverse 16s linear infinite; }
        .ring-spin-3 { animation: spin-slow 9s linear infinite; }
        .core-pulse { animation: pulse-ring 3s ease-in-out infinite; }

        /* State-based Core Glows */
        .state-listening .core-glow {
            filter: drop-shadow(0 0 22px #ff3366);
        }
        .state-thinking .core-glow {
            filter: drop-shadow(0 0 24px #ffaa00);
        }
        .state-speaking .core-glow {
            filter: drop-shadow(0 0 26px #00ffaa);
        }
        .state-online .core-glow {
            filter: drop-shadow(0 0 18px #00f3ff);
        }

        /* Equalizer Bars */
        .eq-bar {
            transition: height 0.12s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(3, 9, 20, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.4); border-radius: 9999px; }
    </style>
</head>
